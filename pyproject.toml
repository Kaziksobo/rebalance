[project]
name = "rebalance"
version = "0.1.0"
description = "Calculating the cost-service trade-off of overnight rebalancing."
readme = "README.md"
authors = [
    { name = "Kazik Sobotnicki", email = "Kaziksobo@outlook.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
classifiers = ["Private :: Do Not Upload"] # guard against accidental PyPI upload
dependencies = []

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "ty>=0.0.95",
]

[tool.uv]
required-version = ">=0.13"

[tool.ruff.lint]
select = [
    "E", "F",    # pycodestyle errors, pyflakes
    "I",         # import sorting
    "B", "UP",   # likely bugs, modern syntax
    "RUF",       # ruff-specific checks
    "DTZ",       # naive datetimes: logger stamps UTC, trip files use clock times
    "N",         # naming
    "ANN",       # annotations required (ty has no strict mode to enforce them)
    "D",         # docstrings (google convention below)
    "PT",        # pytest style
    "C90",       # complexity (limit below)
    "SIM", "PTH",  # simplifications, pathlib over os.path
    "T20",       # no stray print (scripts exempt below)
]
ignore = ["N803", "N806"]  # uppercase X-style names are normal in ML code

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN"]           # tests don't need docstrings or annotations
"scripts/**" = ["D", "ANN", "T20"]  # throwaway checks may print and skip annotations

[tool.ty.src]
include = ["src", "tests"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = "-ra --cov --cov-branch --cov-report=term --cov-report=xml"
strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["rebalance"]   # measure the package, not the tests

[tool.coverage.report]
show_missing = true      # print the line numbers that never ran
skip_covered = true      # list only files with gaps, to keep the output short
exclude_also = [
    "if __name__ == .__main__.:",
]
